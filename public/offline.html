<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ec633c"><title>A little offline play · Playroom</title><style>*{box-sizing:border-box}body{margin:0;background:#f8f7f2;color:#303f35;font-family:Arial,sans-serif;display:grid;place-items:center;min-height:100vh;padding:24px}main{width:100%;max-width:440px;text-align:center}h1{font-size:32px;letter-spacing:-1px}p{color:#74806f;font-size:13px;line-height:1.7}canvas{width:100%;touch-action:none;border-radius:16px;outline-color:#ec633c}button,a{display:inline-block;border:0;border-radius:10px;background:#ec633c;color:white;padding:13px 18px;font-size:13px;font-weight:700;text-decoration:none;cursor:pointer}.controls{display:flex;gap:8px;justify-content:center;margin-top:15px}.controls button{background:#e8e7de;color:#303f35}img{width:44px;height:44px}</style></head><body><main><img src="/icon.svg" alt="Playroom"><h1>A little offline happy.</h1><p>You’re offline. Enjoy a practice round of 2048.<br>Ranked scores will be waiting when you reconnect.</p><p id="score" aria-live="polite">Score: 0</p><canvas id="board" width="440" height="440" tabindex="0" role="img" aria-label="2048 offline practice. Use arrow keys or swipe."></canvas><div class="controls"><button data-dir="left" aria-label="Move left">←</button><button data-dir="up" aria-label="Move up">↑</button><button data-dir="down" aria-label="Move down">↓</button><button data-dir="right" aria-label="Move right">→</button></div><p id="status" role="status">Swipe or use the arrow keys.</p><button id="restart">Fresh start</button> <a href="/">Reconnect</a></main><script>
const canvas=document.getElementById('board'),ctx=canvas.getContext('2d');let board,score,over,touch;
const colors={2:'#eee9df',4:'#eddfc8',8:'#eab46d',16:'#e99b59',32:'#ea8356',64:'#e46a47',128:'#e9cb65',256:'#e8c151',512:'#ddb63f',1024:'#d6aa32',2048:'#cda029'};
function tile(){const empty=board.map((n,i)=>n===0?i:-1).filter(i=>i>=0);if(empty.length)board[empty[Math.floor(Math.random()*empty.length)]]=Math.random()<.9?2:4;}
function draw(){ctx.fillStyle='#b8afa2';ctx.fillRect(0,0,440,440);board.forEach((n,i)=>{const x=12+i%4*107,y=12+Math.floor(i/4)*107;ctx.fillStyle=n?colors[n]||'#3d5443':'#cac2b6';ctx.beginPath();ctx.roundRect(x,y,95,95,9);ctx.fill();if(n){ctx.fillStyle=n<8?'#786b5a':'#fffaf1';ctx.font='bold '+(n>=1024?29:38)+'px Arial';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(n,x+47.5,y+49);}});document.getElementById('score').textContent='Score: '+score;}
function start(){board=Array(16).fill(0);score=0;over=false;tile();tile();draw();document.getElementById('status').textContent='Swipe or use the arrow keys.';}
function move(d){if(over)return;const before=[...board];let gain=0;for(let k=0;k<4;k++){let ix=Array.from({length:4},(_,i)=>d==='left'||d==='right'?k*4+i:i*4+k);if(d==='right'||d==='down')ix.reverse();const vals=ix.map(i=>board[i]).filter(Boolean),out=[];for(let i=0;i<vals.length;i++){if(vals[i]===vals[i+1]){out.push(vals[i]*2);gain+=vals[i]*2;i++;}else out.push(vals[i]);}while(out.length<4)out.push(0);ix.forEach((v,i)=>board[v]=out[i]);}if(board.some((n,i)=>n!==before[i])){score+=gain;tile();draw();}over=!board.includes(0)&&!board.some((n,i)=>i%4<3&&n===board[i+1]||i<12&&n===board[i+4]);if(over)document.getElementById('status').textContent='Well played! Time for a fresh start.';}
document.addEventListener('keydown',e=>{const m={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down'};if(m[e.key]){e.preventDefault();move(m[e.key]);}});canvas.addEventListener('pointerdown',e=>{touch={x:e.clientX,y:e.clientY};canvas.setPointerCapture(e.pointerId);});canvas.addEventListener('pointerup',e=>{if(!touch)return;const dx=e.clientX-touch.x,dy=e.clientY-touch.y;if(Math.max(Math.abs(dx),Math.abs(dy))>20)move(Math.abs(dx)>Math.abs(dy)?dx>0?'right':'left':dy>0?'down':'up');touch=null;});document.querySelectorAll('[data-dir]').forEach(b=>b.onclick=()=>move(b.dataset.dir));document.getElementById('restart').onclick=start;start();
</script></body></html>
